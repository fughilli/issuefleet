# Worked multi-project example. Copy to ~/.config/issuefleet/config.toml
# and adjust. Secrets NEVER go here (the parser rejects them) — see
# [credentials] for where they live.

[daemon]
poll_interval_s = 60
max_workers = 4
state_dir = "~/.local/state/issuefleet"
worktree_root = "~/worktrees"

[credentials]
linear_api_key_env = "LINEAR_API_KEY"
linear_api_key_file = "~/.config/issuefleet/linear.key"
github_token_env = ["GITHUB_TOKEN", "GH_TOKEN"]
github_token_file = "~/.config/issuefleet/github.key"
# GitHub App identity (preferred): PRs open as <app>[bot], short-lived
# tokens, one app-level webhook. auto switches to app when id + key exist.
github_auth = "auto"
github_app_id = ""
github_app_key_file = "~/.config/issuefleet/github_app.pem"
# linear_auth: auto (infer from a static key's prefix) | api_key (raw) |
# oauth (Bearer) | client_credentials. Prefer "client_credentials" for the
# daemon: it mints its own 30-day app-actor token from the client id/secret
# below (no browser, auto-refetched on expiry/401), so there's no linear.key
# to rotate and no daily re-auth.
linear_auth = "client_credentials"
# OAuth app (client id is not a secret; secret follows env-then-file rules).
# Used both by `issuefleet linear-oauth` (one-time workspace install) and,
# under client_credentials, as the daemon's runtime credential.
linear_oauth_client_id = ""
linear_oauth_client_secret_file = "~/.config/issuefleet/linear_oauth_client.secret"

# Push wake-ups (and required for the Linear agents platform). Put a tunnel
# (Cloudflare Tunnel / Tailscale Funnel) in front of 127.0.0.1:8787.
[webhooks]
enabled = false
bind = "127.0.0.1"
port = 8787
github_secret_file = "~/.config/issuefleet/github_webhook.secret"
linear_secret_file = "~/.config/issuefleet/linear_webhook.secret"

# Introspection + light-control web UI served by the running daemon: lists
# every worker, shows each one's live transcript + mailbox, can wind a worker
# down, and (under /projects) add a new project to the fleet — clone the repo
# and append a [[projects]] entry to THIS file. It's a control plane, so keep
# it on the tailnet: bind defaults to 0.0.0.0 (reachable from other tailnet
# machines) — never point a public Funnel at it. Set bind = "127.0.0.1" to keep
# it loopback-only, allow_add_project = false for a look-but-don't-touch UI, or
# enabled = false to turn it off.
[dashboard]
enabled = true
bind = "0.0.0.0"
port = 8788
allow_add_project = true

# The security gate scans the diff a worker's `ready` would push for leaked
# credentials before the branch leaves the host — the one mistake this whole
# "credentials never enter the agents" architecture exists to prevent. On by
# default; the block below is only needed to loosen or extend it.
#   mode = "block" (default) rejects a leaky `ready` and wakes the agent with a
#     redacted rationale to fix and resubmit; "warn" pushes anyway but notifies;
#     "off" disables scanning.
#   deep_scan = "claude" additionally runs an LLM pass (reusing the Anthropic
#     key that the fleet manager's advisor uses) to catch secrets the built-in
#     patterns miss. Additive only, and degrades to the deterministic scanner if
#     the key/API is unavailable — it never clears a deterministic hit.
[security]
mode = "block"
deep_scan = "off"

[agent]
max_auto_turns = 50
max_restarts = 3
claude_args = []
claude_container = "claude-container"
# container_config_dir: shared Claude creds dir for workers. In the homelab
# stack set it to your live ~/.config/claude-container/config (never a copy —
# copies get revoked when the host rotates its OAuth token).
# If the repo ships no .claude-container-overlay, issuefleet stages a default
# one per worktree (git-excluded) that installs the python3 the worker needs.
copy_from_repo = [".claude", ".claude-container-overlay"]
launcher_args = ["--skills-ignore-new"]   # needs claude-container > 1.6.12
# docker_platform = "auto"   # default: pin linux/amd64 on arm64 docker hosts (amd64-only images)

# Environment handed to the launcher for every worker. Values are never here —
# each entry names a chmod-600 file (`file`), an env var of the daemon (`env`),
# or a non-secret literal (`value`); a literal that looks like a credential is
# rejected. A worker's container sees a variable only if that workspace's
# .claude-container-overlay/overlay.json also lists it under "env", so nothing
# reaches a project that didn't ask for it (needs claude-container >= 1.7.0).
#
# TS_AUTHKEY is the motivating case: led_mapper's overlay joins the tailnet at
# container start so workers can reach the HITL rigs, which accept tailnet
# peers only. Use an EPHEMERAL, pre-approved, tagged key — each worker's node
# then self-reaps when the container exits.
# [agent.env]
# TS_AUTHKEY = { file = "~/.config/issuefleet/tailscale.key" }
# HITL_SERVERS = { value = "hitl-rig" }

# The motivating case: Linear project "Splanc" feeding fughilli/splanc.
# With the Linear agent installed, strategy "agent" means claims happen
# ONLY by delegating/@-mentioning the bot — no label triggering.
[[projects]]
name = "splanc"
linear_project = "Splanc"
repo = "~/Projects/splanc"
base_ref = "main"
claim = { strategy = "agent" }
state_in_progress = "In Progress"
state_done = "Done"
delete_remote_branch = true

# A second pair, capped at 2 concurrent workers, claimed by workflow state.
[[projects]]
name = "led-mapper"
linear_project = "LED Mapper"
repo = "~/Projects/led_mapper"
base_ref = "main"
claim = { strategy = "state", value = "Ready for agent" }
state_in_progress = "In Progress"
state_done = "Done"
max_workers = 2
