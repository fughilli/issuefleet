# Worked multi-project example. Copy to ~/.config/issuefleet/config.toml
# and adjust. Secrets NEVER go here (the parser rejects them) — see
# [credentials] for where they live.

[daemon]
poll_interval_s = 60
max_workers = 4
state_dir = "~/.local/state/issuefleet"
worktree_root = "~/worktrees"

[credentials]
linear_api_key_env = "LINEAR_API_KEY"
linear_api_key_file = "~/.config/issuefleet/linear.key"
github_token_env = ["GITHUB_TOKEN", "GH_TOKEN"]
github_token_file = "~/.config/issuefleet/github.key"
# GitHub App identity (preferred): PRs open as <app>[bot], short-lived
# tokens, one app-level webhook. auto switches to app when id + key exist.
github_auth = "auto"
github_app_id = ""
github_app_key_file = "~/.config/issuefleet/github_app.pem"
# linear_auth: auto (infer from a static key's prefix) | api_key (raw) |
# oauth (Bearer) | client_credentials. Prefer "client_credentials" for the
# daemon: it mints its own 30-day app-actor token from the client id/secret
# below (no browser, auto-refetched on expiry/401), so there's no linear.key
# to rotate and no daily re-auth.
linear_auth = "client_credentials"
# OAuth app (client id is not a secret; secret follows env-then-file rules).
# Used both by `issuefleet linear-oauth` (one-time workspace install) and,
# under client_credentials, as the daemon's runtime credential.
linear_oauth_client_id = ""
linear_oauth_client_secret_file = "~/.config/issuefleet/linear_oauth_client.secret"

# Push wake-ups (and required for the Linear agents platform). Put a tunnel
# (Cloudflare Tunnel / Tailscale Funnel) in front of 127.0.0.1:8787.
[webhooks]
enabled = false
bind = "127.0.0.1"
port = 8787
github_secret_file = "~/.config/issuefleet/github_webhook.secret"
linear_secret_file = "~/.config/issuefleet/linear_webhook.secret"

# Introspection web UI served by the running daemon: lists every worker, shows
# each one's live transcript + mailbox, and can wind a worker down (POST +
# confirm dialog). Read-mostly control plane — bind loopback and put a PRIVATE
# tunnel (Tailscale serve, not a public Funnel) in front. Disable with
# enabled = false.
[dashboard]
enabled = true
bind = "127.0.0.1"
port = 8788

[agent]
max_auto_turns = 50
max_restarts = 3
claude_args = []
claude_container = "claude-container"
# container_config_dir: shared Claude creds dir for workers. In the homelab
# stack set it to your live ~/.config/claude-container/config (never a copy —
# copies get revoked when the host rotates its OAuth token).
copy_from_repo = [".claude", ".claude-container-overlay"]
launcher_args = ["--skills-ignore-new"]   # needs claude-container > 1.6.12

# The motivating case: Linear project "Splanc" feeding fughilli/splanc.
# With the Linear agent installed, strategy "agent" means claims happen
# ONLY by delegating/@-mentioning the bot — no label triggering.
[[projects]]
name = "splanc"
linear_project = "Splanc"
repo = "~/Projects/splanc"
base_ref = "main"
claim = { strategy = "agent" }
state_in_progress = "In Progress"
state_done = "Done"
delete_remote_branch = true

# A second pair, capped at 2 concurrent workers, claimed by workflow state.
[[projects]]
name = "led-mapper"
linear_project = "LED Mapper"
repo = "~/Projects/led_mapper"
base_ref = "main"
claim = { strategy = "state", value = "Ready for agent" }
state_in_progress = "In Progress"
state_done = "Done"
max_workers = 2
