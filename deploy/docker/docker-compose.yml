# issuefleet + Tailscale Funnel, autostarting. See README.md in this dir.
#
# THE INVARIANT: worktrees/repos/claude-config/state are mounted at
# identical paths on host and in the daemon container, because the launcher
# passes them to the HOST docker daemon when starting workers. The root is
# ISSUEFLEET_ROOT (set it in .env), default /srv/issuefleet. On macOS /
# Docker Desktop, /srv is not on the File Sharing list (and the sealed
# system volume makes adding it awkward) — use a root under /Users, e.g.
# ISSUEFLEET_ROOT=/Users/you/issuefleet. Keep config.toml in agreement:
#   worktree_root = "<ROOT>/worktrees"
#   repo          = "<ROOT>/repos/<name>"
#   state_dir     = "<ROOT>/state"
#   [agent] container_config_dir = "<ROOT>/claude-config"

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: issuefleet            # becomes the tailnet machine name
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}    # from .env; a reusable or tagged auth key
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/funnel.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./funnel.json:/config/funnel.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  issuefleet:
    # CI publishes this tag; `docker compose pull issuefleet` gets the
    # latest without a local build. `up --build` (the bazel :up target)
    # builds from source instead.
    image: ghcr.io/fughilli/issuefleet:latest
    build:
      context: ../..                # the issuefleet repo root
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    # Share the tailscale service's network namespace so Funnel's proxy to
    # 127.0.0.1:8787 reaches the webhook listener directly (keep the
    # listener's default loopback bind).
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # Workers are launched on the HOST docker daemon:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mounts (the invariant above):
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/worktrees:${ISSUEFLEET_ROOT:-/srv/issuefleet}/worktrees
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/repos:${ISSUEFLEET_ROOT:-/srv/issuefleet}/repos
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/claude-config:${ISSUEFLEET_ROOT:-/srv/issuefleet}/claude-config
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/state:${ISSUEFLEET_ROOT:-/srv/issuefleet}/state
      # Operator-provided pieces (container-side paths fixed; path-free):
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/config:/etc/issuefleet:ro   # config.toml + keys
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/ssh:/root/.ssh:ro           # push key + known_hosts
      - ${ISSUEFLEET_ROOT:-/srv/issuefleet}/bin/claude-container:/usr/local/bin/claude-container:ro

volumes:
  ts-state:
