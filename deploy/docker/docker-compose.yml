# issuefleet + Tailscale Funnel, autostarting. See README.md in this dir.
#
# THE INVARIANT: worktrees/repos/claude-config/state are mounted at
# identical paths on host and in the daemon container, because the launcher
# passes them to the HOST docker daemon when starting workers. The root is
# Layout: DATA lives under ISSUEFLEET_ROOT ($HOME/.issuefleet, declared once
# in env.sh, exported by every bazel wrapper, same-path mounted for the
# sibling-container worker launches); CONFIG + SECRETS live in
# ~/.config/issuefleet exactly like a laptop setup, mounted at the
# container's home path so ~/-based credential paths resolve in both
# worlds. Data paths in config.toml use ${ISSUEFLEET_ROOT}/... (the daemon
# defaults it to ~/.issuefleet when unset, so one config serves laptop and
# container):
#   worktree_root = "${ISSUEFLEET_ROOT}/worktrees"
#   repo          = "${ISSUEFLEET_ROOT}/repos/<name>"
#   state_dir     = "${ISSUEFLEET_ROOT}/state"
#   [agent] container_config_dir = "${ISSUEFLEET_ROOT}/claude-config"

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: issuefleet            # becomes the tailnet machine name
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}    # from .env; a reusable or tagged auth key
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/funnel.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./funnel.json:/config/funnel.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  issuefleet:
    # CI publishes this tag; `docker compose pull issuefleet` gets the
    # latest without a local build. `up --build` (the bazel :up target)
    # builds from source instead.
    image: ghcr.io/fughilli/issuefleet:latest
    build:
      context: ../..                # the issuefleet repo root
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    # Share the tailscale service's network namespace so Funnel's proxy to
    # 127.0.0.1:8787 reaches the webhook listener directly (keep the
    # listener's default loopback bind).
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      # Lets config.toml use ${ISSUEFLEET_ROOT}/... paths portably.
      - ISSUEFLEET_ROOT=${ISSUEFLEET_ROOT}
      # Same, for a `repo` that points at a checkout the daemon doesn't own.
      # Must be passed: the daemon's fallback is ~/Projects, and ~ is /root
      # in here — which would miss the same-path mount below.
      - ISSUEFLEET_PROJECTS=${ISSUEFLEET_PROJECTS}
      # Those checkouts belong to the host user; this container is root, and
      # git refuses a repo it doesn't own ("dubious ownership"). Scope the
      # exemption to that tree rather than using the blanket `*`. NOTE: this
      # covers the daemon only — see README on worker containers.
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=${ISSUEFLEET_PROJECTS}/*
    volumes:
      # Workers are launched on the HOST docker daemon:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mounts (the invariant above):
      - ${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/worktrees:${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/worktrees
      - ${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/repos:${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/repos
      - ${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/claude-config:${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/claude-config
      - ${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/state:${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/state
      # Checkouts outside the data root (a `repo` pointing at your own working
      # tree). Read-write: the daemon registers worktrees in that repo's .git.
      - ${ISSUEFLEET_PROJECTS:?not set - run via bazel (defaults to HOME/Projects) or export it}:${ISSUEFLEET_PROJECTS:?not set - run via bazel (defaults to HOME/Projects) or export it}
      # Config + secrets: the SAME ~/.config/issuefleet as a laptop setup,
      # mounted at the container's home path so plain ~/... paths in
      # config.toml resolve identically in both worlds.
      - ${ISSUEFLEET_CONFIG:?not set - run via bazel (defaults to HOME/.config/issuefleet)}:/root/.config/issuefleet:ro
      - ${ISSUEFLEET_ROOT:?not set - run via bazel (defaults to HOME/.issuefleet) or export it}/bin/claude-container:/usr/local/bin/claude-container:ro

volumes:
  ts-state:
